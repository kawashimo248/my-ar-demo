<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>Google Cloud WebAR デモ</title>
  <!-- A-Frame (v1.2.0) for 3D Rendering -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <!-- AR.js for A-Frame (v3.3.2) for Camera & Tracking -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Outfit:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* UI Overlay Styling */
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Noto Sans JP', sans-serif;
    }
    
    .ar-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 20px;
    }
    
    .overlay-header {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      color: #fff;
      padding: 12px 20px;
      pointer-events: auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    
    .overlay-header h1 {
      margin: 0 0 4px 0;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .overlay-header h1 span {
      background: linear-gradient(135deg, #3b82f6 0%, #10b981 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: 'Outfit', sans-serif;
    }
    
    .overlay-header p {
      margin: 0;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
    }
    
    .overlay-footer {
      align-self: center;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 16px;
      border-radius: 30px;
      color: #fff;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      pointer-events: auto;
    }
    
    .marker-link {
      color: #60a5fa;
      text-decoration: underline;
      font-weight: 700;
      cursor: pointer;
    }

    /* Target / Scan Guide Overlay */
    .scan-reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      border: 2px dashed rgba(16, 185, 129, 0.4);
      border-radius: 20px;
      pointer-events: none;
      animation: pulse-reticle 2s infinite alternate;
    }

    @keyframes pulse-reticle {
      0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.4; }
      100% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.8; }
    }
    
    /* Remove AR.js built-in VR button and styling tweaks */
    .a-enter-vr {
      display: none !important;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- UI Guide Overlays -->
  <div class="ar-overlay">
    <!-- Header info -->
    <div class="overlay-header">
      <h1><i class="fa-solid fa-cube" style="color: #3b82f6;"></i> Google Cloud <span>WebAR Demo</span></h1>
      <p>A-Frame & AR.js を用いたブラウザ型拡張現実(AR)デモアプリケーション</p>
    </div>
    
    <!-- Central guide box -->
    <div class="scan-reticle"></div>
    
    <!-- Footer instruction -->
    <div class="overlay-footer">
      <i class="fa-solid fa-camera-retro" style="color: #10b981;"></i>
      <span>カメラを起動し、<a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" target="_blank" class="marker-link">Hiroマーカー</a> を写してください</span>
    </div>
  </div>

  <!-- A-Frame AR Scene -->
  <!-- arjs parameters:
       sourceType: webcam (PC/スマホのカメラを使用)
       debugUIEnabled: false (AR.jsのデバッグ用の赤い枠等を非表示に) -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- Hiro Marker definition
         この中に配置された3Dオブジェクトが、マーカー認識時に表示されます -->
    <a-marker preset="hiro">
      
      <!-- 1. Google Cloudを象徴するメイン立方体 (3D Box)
           animation: Y軸方向へ自転させます -->
      <a-box position="0 0.5 0" 
             width="0.8" height="0.8" depth="0.8"
             material="color: #3b82f6; roughness: 0.1; metalness: 0.4; opacity: 0.85;"
             animation="property: rotation; to: 360 360 0; loop: true; dur: 6000; easing: linear">
        
        <!-- 2. 立方体の中に浮かぶインナー球体 (3D Sphere)
             GCP Vertex AI / AIエージェントのコアをイメージ -->
        <a-sphere position="0 0 0" 
                  radius="0.3" 
                  material="color: #8b5cf6; emissive: #8b5cf6; emissiveIntensity: 0.6; roughness: 0.3;">
        </a-sphere>
      </a-box>

      <!-- 3. マーカーの上に浮かぶ3Dテキスト (浮遊エフェクト付き) -->
      <a-entity position="0 1.2 0"
                animation="property: position; to: 0 1.35 0; dir: alternate; dur: 1500; loop: true; easing: easeInOutSine">
        <!-- Floating Text -->
        <a-text value="Google Cloud\nDB & AI" 
                color="#10b981" 
                align="center" 
                width="3" 
                font="https://cdn.aframe.io/fonts/DejaVu-sdf.json"
                font-image="https://cdn.aframe.io/fonts/DejaVu-sdf.png">
        </a-text>
      </a-entity>

      <!-- 4. マーカー上の装飾用ベースリング -->
      <a-ring position="0 0 0" 
              rotation="-90 0 0" 
              radius-inner="0.6" 
              radius-outer="0.75" 
              material="color: #10b981; opacity: 0.5; side: double;">
      </a-ring>
      
    </a-marker>
    
    <!-- AR Camera Entity -->
    <a-entity camera></a-entity>
    
  </a-scene>

</body>
</html>
