<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>分析の助 WebAR デモ</title>
  <!-- A-Frame (v1.2.0) for 3D Engine -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <!-- AR.js for A-Frame (v3.3.2) for Camera Stream -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <script>
    // A-Frame custom component for random walking in 3D space, ignoring gravity
    // It keeps the mascot's face always pointing towards the camera on the Y-axis.
    AFRAME.registerComponent('random-walk', {
      schema: {
        speed: {type: 'number', default: 0.25}, // 左右お散歩用に少しゆっくりめのスピードに調整
        rangeX: {type: 'array', default: [-0.8, 0.8]}, // 画面からはみ出さない左右の範囲
        rangeY: {type: 'array', default: [-0.25, -0.25]}, // 高さは画面下の定位置に固定
        rangeZ: {type: 'array', default: [-2.2, -2.2]} // 距離もカメラから見やすい位置に固定
      },
      
      init: function () {
        this.targetPosition = new THREE.Vector3();
        this.currentPosition = this.el.object3D.position;
        this.getNewTarget();
        this.isMoving = true;
        this.pauseTimeout = null;
      },
      
      getNewTarget: function () {
        const rx = this.data.rangeX.map(Number);
        const ry = this.data.rangeY.map(Number);
        const rz = this.data.rangeZ.map(Number);
        
        this.targetPosition.set(
          Math.random() * (rx[1] - rx[0]) + rx[0],
          Math.random() * (ry[1] - ry[0]) + ry[0],
          Math.random() * (rz[1] - rz[0]) + rz[0]
        );
        
        this.pauseTime = Math.random() * 2000 + 1000; // 次の目的地に向けて歩き始めるまでの休憩時間
      },
      
      tick: function (time, timeDelta) {
        // 1. 移動処理
        if (this.isMoving) {
          const step = (this.data.speed * timeDelta) / 1000;
          const distance = this.currentPosition.distanceTo(this.targetPosition);
          
          if (distance > step) {
            const dir = new THREE.Vector3().subVectors(this.targetPosition, this.currentPosition).normalize();
            this.el.object3D.position.addScaledVector(dir, step);
          } else {
            this.isMoving = false;
            this.pauseTimeout = setTimeout(() => {
              this.getNewTarget();
              this.isMoving = true;
            }, this.pauseTime);
          }
        }
        
        // 2. 向き処理 (常にカメラの方を向かせる: Y軸のみビルボード化)
        const cameraEl = this.el.sceneEl.camera;
        if (cameraEl) {
          const cameraWorldPos = new THREE.Vector3();
          cameraEl.getWorldPosition(cameraWorldPos);
          
          const mascotPos = new THREE.Vector3();
          this.el.object3D.getWorldPosition(mascotPos);
          
          // カメラとマスコットの水平ベクトル
          const dx = cameraWorldPos.x - mascotPos.x;
          const dz = cameraWorldPos.z - mascotPos.z;
          const angleToCamera = Math.atan2(dx, dz);
          
          // 正面(Zプラス方向)を向かせるラジアンを度数に変換
          let targetY = angleToCamera * (180 / Math.PI);
          
          const currentRotation = this.el.getAttribute('rotation') || {x: 0, y: 0, z: 0};
          let diff = targetY - currentRotation.y;
          diff = Math.atan2(Math.sin(diff * Math.PI / 180), Math.cos(diff * Math.PI / 180)) * 180 / Math.PI;
          
          // Y軸はカメラに滑らかに向ける。Z軸は歩行中のみゆらゆら揺らす
          this.el.setAttribute('rotation', {
            x: 0,
            y: currentRotation.y + diff * 0.08, // 緩やかに回転させて滑らかな動きに
            z: this.isMoving ? Math.sin(time / 200) * 5 : 0
          });
        }
      },
      
      remove: function () {
        if (this.pauseTimeout) clearTimeout(this.pauseTimeout);
      }
    });
  </script>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Outfit:wght@600;800&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Noto Sans JP', sans-serif;
      user-select: none;
    }
    
    /* UI Overlay */
    .ar-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 20px;
    }
    
    .overlay-header {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      color: #fff;
      padding: 12px 20px;
      pointer-events: auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      margin: 0 auto;
      width: 95%;
      text-align: center;
    }
    
    .overlay-header h1 {
      margin: 0 0 4px 0;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .overlay-header h1 span {
      background: linear-gradient(135deg, #3b82f6 0%, #10b981 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: 'Outfit', sans-serif;
    }
    
    .overlay-header p {
      margin: 0;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
    }

    /* Floating Bubble Cards (HUD Sideboards) */
    .hud-container {
      position: absolute;
      top: 90px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: auto;
    }

    .hud-left {
      left: 20px;
    }

    .hud-right {
      right: 20px;
    }

    /* The Bubble Card (Premium Dark Glassmorphism) */
    .bubble-card {
      display: flex;
      align-items: stretch;
      background: rgba(28, 28, 30, 0.7); /* 暗めのプレミアムな半透明グレー */
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px; /* 画像そっくりのかなり丸みのある角丸 */
      color: #fff;
      width: 200px; /* メタ情報が消えたため幅を少しスリムに調整 (250px -> 200px) */
      min-height: 44px; /* ハートが消えたため高さをスリムに調整 (56px -> 44px) */
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 0;
      overflow: visible;
    }

    .bubble-card:hover {
      transform: translateY(-2px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6);
    }

    /* Bubble Speech Tail - Left side cards */
    .hud-left .bubble-card::before {
      content: '';
      position: absolute;
      left: -9px;
      top: 50%;
      transform: translateY(-50%);
      border-width: 6px 9px 6px 0;
      border-style: solid;
      border-color: transparent rgba(28, 28, 30, 0.7) transparent transparent;
    }

    /* Bubble Speech Tail - Right side cards */
    .hud-right .bubble-card::before {
      content: '';
      position: absolute;
      right: -9px;
      top: 50%;
      transform: translateY(-50%);
      border-width: 6px 0 6px 9px;
      border-style: solid;
      border-color: transparent transparent transparent rgba(28, 28, 30, 0.7);
    }

    /* Inside Card Container */
    .card-body {
      display: flex;
      flex: 1;
      padding: 8px 12px 8px 18px; /* 左側のパディングを広げてしっぽとのバランスを取る */
      align-items: center;
    }

    /* Center Main Title / Rating Column */
    .card-main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      position: relative;
    }

    /* Title Holder */
    .title-container {
      display: flex;
      align-items: center;
      position: relative;
    }

    /* Main Title */
    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      margin-left: 0; /* マージンをリセットして左揃え */
      line-height: 1.2;
      letter-spacing: -0.2px;
    }

    /* Heart Rating */
    .card-rating {
      display: flex;
      gap: 2px;
      color: #ffffff;
      font-size: 9px;
      margin-top: 4px;
      margin-left: 0; /* マージンをリセットして左揃え */
    }

    /* Right-side Icon Container */
    .card-icon-container {
      width: 54px; /* スリム化に合わせて幅を調整 */
      border-radius: 0 19px 19px 0; /* Align with card right border */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #ffffff;
      flex-shrink: 0;
    }

    /* Matches colors from image precisely */
    .icon-blue {
      background: #009be3; /* Vivid Smartphone Blue */
    }
    
    .icon-purple {
      background: #7c3aed; /* Purple */
    }

    .icon-green {
      background: #10b981; /* Green */
    }

    .icon-orange {
      background: #f97316; /* Orange */
    }

    .icon-pink {
      background: #e43f8d; /* Vivid Baby Pink */
    }

    .icon-brown {
      background: #7a431d; /* Vivid Coffee Brown */
    }

    .icon-teal {
      background: #0d9488; /* Teal */
    }

    .icon-indigo {
      background: #6366f1; /* Indigo */
    }

    .icon-red {
      background: #e11d48; /* YouTube Red */
    }
    
    .overlay-footer {
      align-self: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 24px;
      border-radius: 30px;
      color: #fff;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      pointer-events: auto;
      text-align: center;
      max-width: 90%;
      margin-bottom: 10px;
    }
    
    .tap-hint-icon {
      font-size: 14px;
      color: #10b981;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }

    /* Responsive for smaller mobile viewport */
    @media (max-width: 768px) {
      .hud-container {
        top: 75px;
        gap: 6px;
      }
      .bubble-card {
        width: 140px; /* モバイルもスリム化 (170px -> 140px) */
        min-height: 34px; /* ハートが消えたため高さをスリムに調整 (44px -> 34px) */
        border-radius: 14px;
      }
      .hud-left { left: 8px; }
      .hud-right { right: 8px; }
      .card-body {
        padding: 4px 6px 4px 12px;
      }
      .card-title {
        font-size: 10px;
        margin-left: 0;
      }
      .card-rating {
        font-size: 6px;
        gap: 1px;
        margin-top: 2px;
        margin-left: 0;
      }
      .card-icon-container {
        width: 38px;
        border-radius: 0 13px 13px 0;
        font-size: 14px;
      }
    }

    /* Mascot Speech Bubble (HTML Overlay - Game/SF Style) */
    .speech-dialog {
      position: absolute;
      bottom: 85px; /* フッターの少し上に配置 */
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      width: 88%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.85); /* ダークブルーグレー */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid #10b981; /* ネオングリーン */
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.3), inset 0 0 10px rgba(16, 185, 129, 0.1);
      border-radius: 16px;
      padding: 12px 18px;
      color: #fff;
      pointer-events: auto; /* クリックを有効化 */
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .speech-dialog.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) scale(1);
    }

    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(16, 185, 129, 0.25);
      padding-bottom: 4px;
    }

    .dialog-speaker {
      font-size: 11px;
      font-weight: 800;
      color: #10b981;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dialog-speaker i {
      animation: pulse 1s infinite alternate;
      font-size: 7px;
    }

    .dialog-close {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }

    .dialog-close:hover {
      color: #ef4444;
    }

    .dialog-text {
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.5;
      color: #f1f5f9;
      word-break: break-all;
    }

    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.1); }
    }
  </style>
</head>

  <!-- A-Frame Scene Setup -->
  <a-scene embedded 
           arjs="sourceType: webcam; debugUIEnabled: false;" 
           cursor="rayOrigin: mouse" 
           raycaster="objects: .clickable">
    
    <!-- 3D Mascot Group (Mascot: "分析の助")
         position を 0 -0.2 -2.2 に配置します。 -->
    <a-entity id="mascot-container" 
              position="0 -0.2 -2.2" 
              random-walk="speed: 0.35;">
      
      <!-- タップ対象となる透明なコライダー（クリック判定を広げるため） -->
      <a-box class="clickable"
             id="mascot-collider"
             position="0 -0.1 0" 
             width="0.6" height="1.0" depth="0.6" 
             material="opacity: 0; transparent: true;">
      </a-box>
      
      <!-- 1. 分析の助の本体 (1/2サイズへ縮小) -->
      <a-entity id="mascot-model" scale="0.5 0.5 0.5">
        <!-- 外側のフラスコガラス (半透明) -->
        <a-sphere radius="0.45" 
                  position="0 -0.15 0"
                  color="#94a3b8" 
                  material="roughness: 0.1; metalness: 0.9; opacity: 0.4; transparent: true;">
        </a-sphere>
        <!-- フラスコの首部分 (半透明) -->
        <a-cylinder position="0 0.35 0" 
                    radius="0.12" 
                    height="0.4" 
                    color="#94a3b8" 
                    material="roughness: 0.1; metalness: 0.9; opacity: 0.4; transparent: true;">
        </a-cylinder>
        <!-- フラスコの口部分 (半透明リング) -->
        <a-torus position="0 0.55 0" 
                 rotation="90 0 0" 
                 radius="0.12" 
                 radius-tubular="0.015" 
                 color="#94a3b8" 
                 material="roughness: 0.1; metalness: 0.9; opacity: 0.55; transparent: true;">
        </a-torus>

  <!-- JavaScript for Interactions -->
  <script>
    const mascot = document.getElementById('mascot-collider');
    const mascotModel = document.getElementById('mascot-model');
    const mascotContainer = document.getElementById('mascot-container');
    
    // HTML Dialog elements
    const htmlDialog = document.getElementById('html-speech-dialog');
    const htmlSpeechText = document.getElementById('html-speech-text');
    const dialogCloseBtn = document.getElementById('dialog-close-btn');
    
    const analysisItems = [
      "EPMA分析",
      "X線回折",
      "ICP/MS",
      "吸光度",
      "連続測定",
      "GC",
      "GC/MS",
      "ガス分析",
      "水質分析",
      "材料分析",
      "成分分析",
      "技報",
      "YOUTUBE"
    ];

    const messageTemplates = [
      "{item}できるよ。",
      "{item}について知りたいですか？",
      "{item}ならお任せください！",
      "{item}をお手伝いしますよ。",
      "{item}をコツコツ調べますね。",
      "{item}のデータに異常はありません！",
      "{item}を調べましょう！",
      "{item}でお困りですか？"
    ];

    function generateRandomDialogue() {
      const randomItem = analysisItems[Math.floor(Math.random() * analysisItems.length)];
      const randomTemplate = messageTemplates[Math.floor(Math.random() * messageTemplates.length)];
      return randomTemplate.replace("{item}", randomItem);
    }

    let bubbleTimeout = null;
    let autoSpeechTimeout = null; // 自動で喋るためのタイマー
    let isJumping = false;

    // ダイアログを閉じて、ランダム歩行を再開し、次の発話を予約する関数
    function closeDialog() {
      htmlDialog.classList.remove('show');
      const movement = mascotContainer.components['random-walk'];
      if (movement) {
        movement.isMoving = true;
      }
      
      // ダイアログが閉じてから 8〜14秒 のランダムな間隔の後に自動で次のひとりごとを言う
      scheduleAutoSpeech();
    }

    // 閉じるボタンのイベント
    dialogCloseBtn.addEventListener('click', (e) => {
      e.stopPropagation(); // バブリングを防止
      closeDialog();
    });

    // 自動発話（ひとりごと）をトリガーする関数
    function triggerAutoSpeech() {
      // 喋る際はお散歩を一時停止
      const movement = mascotContainer.components['random-walk'];
      if (movement) {
        movement.isMoving = false;
        // 停止時は体の傾きを正面に戻す
        const currentRotation = mascotContainer.getAttribute('rotation') || {x: 0, y: 0, z: 0};
        mascotContainer.setAttribute('rotation', {x: 0, y: currentRotation.y, z: 0});
      }

      // 分析項目を組み合わせたランダムセリフを表示
      const dialogueText = generateRandomDialogue();
      htmlSpeechText.textContent = dialogueText;
      htmlDialog.classList.add('show');

      // 4秒後に自動的にダイアログを閉じて歩行再開
      clearTimeout(bubbleTimeout);
      bubbleTimeout = setTimeout(() => {
        closeDialog();
      }, 4000);
    }

    // 次の自動ひとりごとをスケジュールする関数
    function scheduleAutoSpeech() {
      clearTimeout(autoSpeechTimeout);
      // お散歩中に 8〜14秒 のランダム間隔で発動
      const nextDelay = Math.random() * 6000 + 8000;
      autoSpeechTimeout = setTimeout(() => {
        triggerAutoSpeech();
      }, nextDelay);
    }

    // タップ時の即時発話イベント
    mascot.addEventListener('click', () => {
      // 自動おしゃべりタイマーを一時リセット
      clearTimeout(autoSpeechTimeout);

      // ゆるキャラのランダム歩行コンポーネントを一時停止
      const movement = mascotContainer.components['random-walk'];
      if (movement) {
        movement.isMoving = false;
        const currentRotation = mascotContainer.getAttribute('rotation') || {x: 0, y: 0, z: 0};
        mascotContainer.setAttribute('rotation', {x: 0, y: currentRotation.y, z: 0});
      }

      // 分析項目を動的に組み合わせたランダムセリフの適用
      const dialogueText = generateRandomDialogue();
      htmlSpeechText.textContent = dialogueText;
      
      // HTMLダイアログを表示
      htmlDialog.classList.add('show');

      // タップされた時はジャンプアクション
      if (!isJumping) {
        isJumping = true;
        mascotModel.setAttribute('animation', {
          property: 'position',
          to: '0 0.3 0',
          dir: 'alternate',
          dur: 250,
          loop: 2,
          easing: 'easeInOutQuad'
        });
        
        setTimeout(() => {
          mascotModel.removeAttribute('animation');
          mascotModel.setAttribute('position', '0 0 0');
          isJumping = false;
        }, 500);
      }

      clearTimeout(bubbleTimeout);
      // 4秒後に自動的にダイアログを閉じて歩行再開 ＆ 次の自動おしゃべりを予約
      bubbleTimeout = setTimeout(() => {
        closeDialog();
      }, 4000);
    });

    // アプリ起動（ロード）完了から 5秒 後に、最初のひとりごとを言うように予約
    autoSpeechTimeout = setTimeout(() => {
      triggerAutoSpeech();
    }, 5000);
  </script>

</body>
